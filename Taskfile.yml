version: '3'

vars:
  COMPONENT_NAME:
    sh: '{{if eq OS "windows"}}echo ompphp.dll{{else}}echo ompphp.so{{end}}'

tasks:
  default:
    cmds:
      - task: test

  generate:
    desc: Generate bindings from the pinned open.mp C API metadata
    cmds:
      - go run ./tools/codegen

  generate:check:
    desc: Verify generated bindings are current
    cmds:
      - task: generate
      - git diff --exit-code -- sdk/src/Internal/api_generated.php sdk/src/Api sdk/src/Event/Events.php sdk/src/Event/Handlers.php sdk/src/Constant cmd/component/native_generated.go cmd/component/native_generated.h cmd/component/events_generated.go cmd/component/events_generated.h

  build:
    desc: Build the standalone runtime runner
    cmds:
      - go build -o build/ompphp{{exeExt}} ./cmd/ompphp

  component:
    desc: Build the required CAPI and ompphp components for x86-64 Linux
    deps: [capi]
    env:
      CGO_ENABLED: '1'
      GOARCH: amd64
    cmds:
      - go build -mod=vendor -buildmode=c-shared -o build/ompphp.so ./cmd/component

  capi:
    desc: Build the required standalone CAPI component for x86-64 Linux
    cmds:
      - cmake -S third_party/omp-capi -B build/capi/linux -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DOMP_CAPI_BUILD_TESTS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - cmake --build build/capi/linux --parallel

  capi:windows:
    desc: Build the required standalone CAPI component for x86-64 Windows on Windows
    platforms: [windows]
    cmds:
      - cmake -S third_party/omp-capi -B build/capi/windows -A x64 -T ClangCL -DOMP_CAPI_BUILD_TESTS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - cmake --build build/capi/windows --config Release --parallel

  component:windows:
    desc: Cross-build the x86-64 Windows component
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '1'
      CC: x86_64-w64-mingw32-gcc
    cmds:
      - go build -mod=vendor -buildmode=c-shared -o build/ompphp.dll ./cmd/component

  component:host:
    desc: Build a host-architecture component for local diagnostics
    env:
      CGO_ENABLED: '1'
    cmds:
      - go build -mod=vendor -buildmode=c-shared -o build/{{.COMPONENT_NAME}} ./cmd/component

  e2e:
    desc: Load ompphp and execute PHP in the official open.mp Linux server
    deps: [component]
    cmds:
      - ./tests/e2e-openmp.sh --skip-build

  sdk:install:
    cmds:
      - composer install --working-dir=sdk --no-interaction --no-progress

  sdk:test:
    deps: [sdk:install]
    cmds:
      - composer validate --working-dir=sdk --strict
      - composer analyse --working-dir=sdk
      - composer test --working-dir=sdk

  sdk:package:
    desc: Package the Composer SDK artifact
    vars:
      VERSION: '{{default "0.1.0-dev" .VERSION}}'
    cmds:
      - go run ./tools/sdkpack -version {{.VERSION}}

  examples:test:
    desc: Validate and syntax-check the example gamemodes
    cmds:
      - for example in examples/*/composer.json; do composer validate --strict "$example"; done
      - for example in examples/*/composer.json; do composer install --working-dir="$(dirname "$example")" --no-interaction --no-progress; done
      - find examples -path '*/vendor' -prune -o -name '*.php' -exec php -l {} \;

  test:
    deps: [generate]
    cmds:
      - go test ./...
      - task: sdk:test

  test:race:
    deps: [generate]
    cmds:
      - go test -race -short -timeout=3m ./...

  benchmark:
    desc: Run concurrency and transport benchmarks
    cmds:
      - go test -run '^$' -bench . ./internal/concurrency ./internal/transport ./internal/runtime

  test:stress:
    desc: Run high-volume concurrency tests
    cmds:
      - go test -race -count=1 ./internal/concurrency
      - go test -race -count=1 -run SeparateWorker ./internal/runtime

  test:soak:
    desc: Run the one-minute scheduler lifecycle and leak soak test
    env:
      OMPPHP_STRESS_DURATION: 1m
    cmds:
      - go test -race -count=1 -timeout=3m -run SchedulerSoakAndLifecycleCleanup ./internal/concurrency

  check:
    cmds:
      - task: sdk:test
      - task: examples:test
      - task: test:race
      - task: generate:check
      - test -z "$(gofmt -l async cmd internal tools)"
      - go vet ./...
      - git diff --check

  clean:
    cmds:
      - go clean
      - rm -f build/ompphp build/ompphp.exe build/ompphp.so build/ompphp.dll build/ompphp.h
