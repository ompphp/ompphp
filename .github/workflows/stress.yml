name: Concurrency Stress

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 0'

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v1
      - run: task test:stress
      - run: task test:soak
      - run: go test -race -count=1 ./internal/transport
      - run: task benchmark | tee benchmark.txt
      - uses: actions/upload-artifact@v4
        with:
          name: concurrency-benchmarks
          path: benchmark.txt
